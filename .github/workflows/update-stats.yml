name: Update GitHub stats card

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity overview card
        env:
          LOGIN: Mustafa-Bleidi
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_activity_overview.py

      - name: Generate top languages card
        env:
          LOGIN: Mustafa-Bleidi
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_top_languages.py

      - name: Bust README image cache
        run: python3 scripts/bust_readme_cache.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity-overview.svg profile/top-languages.svg README.md
          git diff --staged --quiet || git commit -m "chore: update stats cards"
          git push
